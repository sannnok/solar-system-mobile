# Publishes the orrery to GitHub Pages.
#
# There is no build step — the repository is the site — so this checks out,
# uploads, and deploys. `configure-pages` with `enablement: true` turns Pages on
# the first time this runs, so the site comes up without anyone visiting the
# repository settings.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/3d-solar-system-quld97
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository is the site; the action drops .git and .github.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
